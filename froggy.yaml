esphome:
  name: froggy
  friendly_name: Froggy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret froggy_ota_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris
    on_time_sync:
      then:
        - delay: 8s
        - deep_sleep.enter:
            id: deep_sleep_1
            sleep_duration: !lambda |-
              auto now = id(sntp_time).now();
              return ((60 - now.second) * 1000) + 5000;

external_components:
  - source:
      type: git
      url: https://github.com/dz0ny/esphome-bthome
      ref: pull/19/head
    components: [bthome]

sensor:
  - platform: dht
    pin: GPIO21
    model: DHT22
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: hum
      name: "Humidity"
    update_interval: 60s

bthome:
  ble_stack: nimble
  min_interval: 2s
  max_interval: 10s
  tx_power: 9
  retransmit_count: 5
  retransmit_interval: 600ms
  sensors:
    - type: temperature
      id: temp
    - type: humidity
      id: hum

deep_sleep:
  id: deep_sleep_1